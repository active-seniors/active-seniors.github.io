title: Join In Guernsey
description: >-
  Clubs, groups, classes and volunteering across Guernsey, Alderney and Sark. For anyone
  with more time on their hands, and for the family, carers and health professionals
  helping them find something to do.
baseurl: ""
url: "https://joinin.thequarry.media"

quarry_url: "https://www.thequarry.media"

# Submission bridge (orchestration/submission) endpoint — deployed 5 Oct 2026.
# The form page shows a "not live yet" notice if this is ever unset.
submission_endpoint: "https://active-seniors-submission-bridge.active-ageing.workers.dev"

collections:
  listings:
    output: true
    permalink: /listings/:path/

defaults:
  - scope:
      path: ""
      type: listings
    values:
      layout: listing
  - scope:
      path: ""
    values:
      layout: default

markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTRIBUTING.md
