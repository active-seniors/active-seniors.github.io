title: Join In Guernsey
description: >-
  Clubs, groups and get-togethers across every parish — have a look, then go along.
  Built for the G-Prize 2026 Active Ageing challenge.
baseurl: ""
url: "https://active-seniors.github.io"

# TODO: real URL needed from Jon — do not guess. Footer link is hidden until this is set.
quarry_url: ""

# Submission bridge (orchestration/submission) endpoint — deployed 5 Oct 2026.
# The form page shows a "not live yet" notice if this is ever unset.
submission_endpoint: "https://active-seniors-submission-bridge.active-ageing.workers.dev"

collections:
  listings:
    output: true
    permalink: /listings/:path/

defaults:
  - scope:
      path: ""
      type: listings
    values:
      layout: listing
  - scope:
      path: ""
    values:
      layout: default

markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTRIBUTING.md
