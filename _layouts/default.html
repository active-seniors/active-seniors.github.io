<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #1a1a1a; }
    header { margin-bottom: 2rem; }
    header a { text-decoration: none; color: inherit; }
    header h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
    header p { margin: 0; color: #555; font-size: 0.95rem; }
    .listing-card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .listing-card h3 { margin: 0 0 0.25rem; }
    .listing-card h3 a { text-decoration: none; color: #0b5fff; }
    .meta { color: #555; font-size: 0.9rem; }
    .tag { display: inline-block; background: #eef2ff; color: #333; border-radius: 4px; padding: 0.1rem 0.5rem; font-size: 0.8rem; margin-right: 0.3rem; }
    footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #eee; color: #777; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <a href="{{ '/' | relative_url }}"><h1>{{ site.title }}</h1></a>
    <p>{{ site.description }}</p>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    <p>Built for the <a href="https://innovateguernsey.com/gprize">G-Prize 2026</a> Active Ageing challenge. Listings are reviewed by humans before publishing — see this site's <a href="https://github.com/active-seniors/active-seniors.github.io">GitHub history</a> for the full audit trail.</p>
  </footer>
</body>
</html>
